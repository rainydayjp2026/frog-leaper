<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Frog Leaper - カエルの蓮渡り</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #132238;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: Arial, sans-serif;
  }
  canvas {
    display: block;
    background: #87ceeb;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const CW = 400;
  const CH = 700;
  const WATER_Y = 430;
  const GROUND_Y = WATER_Y - 46;
  const SHORE_X = 150;
  const FROG_W = 34;
  const FROG_H = 28;
  const PAD_H = 16;
  const PAD_W_MIN = 74;
  const PAD_W_MAX = 102;
  const RUN_SPEED = 2.5;
  const GRAVITY = 0.48;
  const JUMP_VY = -8.9;
  const TAP_BOOST_VY = -9.7;
  const TIMING_WINDOW_HEIGHT = 38;
  const SINK_DEPTH = 36;
  const PAD_EXIT_MARGIN = 10;
  const CAMERA_LEFT_MARGIN = 100;
  const WATER_SCROLL_SPEED = 0.9;

  const state = {
    mode: 'title',
    frame: 0,
    score: 0,
    bestScore: 0,
    cameraX: 0,
    pads: [],
    particles: [],
    lilyCounter: 0,
    timingWindowActive: false,
    timingWindowProgress: 0,
    inputLockedUntilRelease: false,
    frog: createFrog(),
    buttons: {
      primary: null
    }
  };

  function createFrog() {
    return {
      x: 84,
      y: GROUND_Y - FROG_H / 2,
      vy: 0,
      state: 'running',
      supportId: 'land',
      leftSupportAt: 0,
      alive: true,
      rotation: 0,
      justBoosted: false
    };
  }

  function resize() {
    const ratio = CW / CH;
    let width = window.innerWidth;
    let height = window.innerHeight;

    if (width / height > ratio) {
      width = height * ratio;
    } else {
      height = width / ratio;
    }

    canvas.width = Math.round(width);
    canvas.height = Math.round(height);
    canvas.style.width = canvas.width + 'px';
    canvas.style.height = canvas.height + 'px';
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function worldToScreenX(worldX) {
    return worldX - state.cameraX;
  }

  function frogScreenX() {
    return worldToScreenX(state.frog.x);
  }

  function resetWorld() {
    state.frame = 0;
    state.score = 0;
    state.cameraX = 0;
    state.pads = [];
    state.particles = [];
    state.lilyCounter = 0;
    state.timingWindowActive = false;
    state.timingWindowProgress = 0;
    state.inputLockedUntilRelease = false;
    state.buttons.primary = null;
    state.frog = createFrog();

    let nextX = SHORE_X + 88;
    for (let i = 0; i < 8; i++) {
      nextX = addPad(nextX);
    }
  }

  function addPad(startX) {
    const scoreFactor = Math.min(state.score, 18);
    const gapMin = 78 + scoreFactor * 2.5;
    const gapMax = 122 + scoreFactor * 3.5;
    const width = rand(PAD_W_MIN, PAD_W_MAX);
    const padCenterX = startX + rand(gapMin, gapMax);
    const padY = WATER_Y - 4 + rand(-12, 12);

    state.pads.push({
      id: 'pad-' + (++state.lilyCounter),
      x: padCenterX,
      y: padY,
      w: width,
      h: PAD_H,
      counted: false
    });

    return padCenterX + width / 2;
  }

  function startGame() {
    resetWorld();
    state.mode = 'playing';
  }

  function gameOver() {
    if (state.mode !== 'playing') return;
    state.mode = 'gameover';
    state.bestScore = Math.max(state.bestScore, state.score);
    state.timingWindowActive = false;
    state.timingWindowProgress = 0;
    state.frog.alive = false;
    state.frog.state = 'sinking';
    spawnSplash(state.frog.x, Math.max(WATER_Y, state.frog.y + FROG_H / 2 - 4), 16);
  }

  function spawnSplash(worldX, worldY, count) {
    for (let i = 0; i < count; i++) {
      const angle = rand(-Math.PI * 0.9, -Math.PI * 0.1);
      const speed = rand(1.1, 4.4);
      state.particles.push({
        x: worldX,
        y: worldY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: rand(18, 34),
        size: rand(2, 5),
        color: Math.random() > 0.5 ? '#b3ecff' : '#5ec8ff'
      });
    }
  }

  function ensurePadsAhead() {
    let lastPad = state.pads[state.pads.length - 1];
    while (!lastPad || lastPad.x < state.cameraX + CW + 220) {
      const startX = lastPad ? lastPad.x + lastPad.w / 2 : SHORE_X + 88;
      addPad(startX);
      lastPad = state.pads[state.pads.length - 1];
    }

    state.pads = state.pads.filter(function(pad) {
      return pad.x + pad.w / 2 > state.cameraX - 180;
    });
  }

  function updateCamera() {
    const targetCameraX = Math.max(0, state.frog.x - CAMERA_LEFT_MARGIN);
    state.cameraX += (targetCameraX - state.cameraX) * 0.12;
  }

  function getPadTop(pad) {
    return pad.y - pad.h / 2;
  }

  function supportSurfaceY(supportId) {
    if (supportId === 'land') return GROUND_Y;
    const pad = state.pads.find(function(item) { return item.id === supportId; });
    return pad ? getPadTop(pad) : GROUND_Y;
  }

  function updateRunning() {
    const frog = state.frog;
    frog.x += RUN_SPEED;
    frog.y = supportSurfaceY(frog.supportId) - FROG_H / 2;

    if (frog.supportId === 'land') {
      if (frog.x + FROG_W / 2 >= SHORE_X) {
        launchFrog();
      }
      return;
    }

    const currentPad = state.pads.find(function(item) { return item.id === frog.supportId; });
    if (!currentPad) {
      launchFrog();
      return;
    }

    const padRight = currentPad.x + currentPad.w / 2;
    if (frog.x + FROG_W / 2 >= padRight - PAD_EXIT_MARGIN) {
      launchFrog();
    }
  }

  function launchFrog(boosted) {
    const frog = state.frog;
    frog.state = 'air';
    frog.leftSupportAt = frog.x;
    frog.vy = boosted ? TAP_BOOST_VY : JUMP_VY;
    frog.justBoosted = !!boosted;
    frog.supportId = null;
    state.timingWindowActive = false;
    state.timingWindowProgress = 0;
  }

  function maybeLandOnPad(previousBottom) {
    const frog = state.frog;
    const currentBottom = frog.y + FROG_H / 2;
    const frogLeft = frog.x - FROG_W / 2 + 4;
    const frogRight = frog.x + FROG_W / 2 - 4;

    for (const pad of state.pads) {
      const padLeft = pad.x - pad.w / 2;
      const padRight = pad.x + pad.w / 2;
      const padTop = getPadTop(pad);
      if (frogRight < padLeft || frogLeft > padRight) continue;
      if (frog.vy < 0) continue;
      if (previousBottom <= padTop + 2 && currentBottom >= padTop - 3) {
        frog.state = 'running';
        frog.supportId = pad.id;
        frog.vy = 0;
        frog.y = padTop - FROG_H / 2;
        frog.justBoosted = false;
        state.timingWindowActive = false;
        state.timingWindowProgress = 0;
        if (!pad.counted) {
          pad.counted = true;
          state.score += 1;
          state.bestScore = Math.max(state.bestScore, state.score);
        }
        return true;
      }
    }
    return false;
  }

  function updateAirborne() {
    const frog = state.frog;
    const previousBottom = frog.y + FROG_H / 2;

    frog.x += RUN_SPEED;
    frog.vy += GRAVITY;
    frog.y += frog.vy;

    if (maybeLandOnPad(previousBottom)) {
      return;
    }

    const bottom = frog.y + FROG_H / 2;
    const inWindow = frog.vy > 0 && bottom >= WATER_Y - TIMING_WINDOW_HEIGHT && bottom <= WATER_Y + 6;
    state.timingWindowActive = inWindow;
    state.timingWindowProgress = clamp((bottom - (WATER_Y - TIMING_WINDOW_HEIGHT)) / (TIMING_WINDOW_HEIGHT + 6), 0, 1);

    if (bottom > WATER_Y + SINK_DEPTH) {
      gameOver();
    }
  }

  function updateSinking() {
    const frog = state.frog;
    frog.x += RUN_SPEED * 0.35;
    frog.vy += GRAVITY * 0.25;
    frog.y += Math.max(frog.vy, 1.6);
  }

  function updateParticles() {
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.life -= 1;
      if (p.life <= 0) {
        state.particles.splice(i, 1);
      }
    }
  }

  function update() {
    state.frame += 1;

    if (state.mode === 'playing') {
      if (state.frog.state === 'running') {
        updateRunning();
      } else if (state.frog.state === 'air') {
        updateAirborne();
      } else if (state.frog.state === 'sinking') {
        updateSinking();
      }
      ensurePadsAhead();
      updateCamera();
    } else if (state.mode === 'gameover') {
      updateSinking();
      updateCamera();
    }

    updateParticles();
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(canvas.width / CW, canvas.height / CH);
  }

  function finishFrame() {
    ctx.restore();
  }

  function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawCloud(x, y, size, alpha) {
    ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
    ctx.beginPath();
    ctx.arc(x, y, size * 0.38, 0, Math.PI * 2);
    ctx.arc(x + size * 0.36, y - size * 0.12, size * 0.31, 0, Math.PI * 2);
    ctx.arc(x + size * 0.7, y, size * 0.26, 0, Math.PI * 2);
    ctx.arc(x + size * 0.32, y + size * 0.12, size * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, WATER_Y);
    sky.addColorStop(0, '#5ec8ff');
    sky.addColorStop(0.55, '#98e2ff');
    sky.addColorStop(1, '#d6f7ff');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, CW, WATER_Y);

    const cloudOffset = (state.cameraX * 0.12) % 520;
    drawCloud(48 - cloudOffset, 70, 72, 0.65);
    drawCloud(222 - cloudOffset, 108, 52, 0.52);
    drawCloud(390 - cloudOffset, 82, 62, 0.56);
    drawCloud(560 - cloudOffset, 64, 68, 0.48);

    const water = ctx.createLinearGradient(0, WATER_Y, 0, CH);
    water.addColorStop(0, '#119fe7');
    water.addColorStop(0.35, '#0a81ca');
    water.addColorStop(1, '#0d5594');
    ctx.fillStyle = water;
    ctx.fillRect(0, WATER_Y, CW, CH - WATER_Y);

    ctx.strokeStyle = 'rgba(255,255,255,0.34)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x <= CW; x += 2) {
      const y = WATER_Y + Math.sin((x + state.frame * WATER_SCROLL_SPEED) * 0.05) * 3 + Math.sin((x + state.frame * 0.7) * 0.1) * 1.5;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    const shoreScreenX = worldToScreenX(SHORE_X);
    ctx.fillStyle = '#b78d57';
    ctx.fillRect(0, GROUND_Y, Math.max(shoreScreenX, 0), CH - GROUND_Y);

    ctx.fillStyle = '#8ecf63';
    ctx.fillRect(0, GROUND_Y - 16, Math.max(shoreScreenX + 10, 0), 18);

    if (shoreScreenX > -30 && shoreScreenX < CW + 80) {
      ctx.fillStyle = '#d9b47b';
      ctx.beginPath();
      ctx.moveTo(shoreScreenX - 14, GROUND_Y);
      ctx.lineTo(shoreScreenX + 26, GROUND_Y);
      ctx.lineTo(shoreScreenX + 8, WATER_Y + 10);
      ctx.lineTo(shoreScreenX - 24, WATER_Y + 6);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawLilyPad(screenX, y, w, h) {
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath();
    ctx.ellipse(screenX + 4, y + 5, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#3fa34d';
    ctx.beginPath();
    ctx.ellipse(screenX, y, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#6ecb63';
    ctx.beginPath();
    ctx.ellipse(screenX - 2, y - 1, w * 0.3, h * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.ellipse(screenX, y, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.moveTo(screenX - w * 0.18, y + h * 0.02);
    ctx.lineTo(screenX + w * 0.15, y - h * 0.2);
    ctx.stroke();
  }

  function drawFrog() {
    const frog = state.frog;
    const x = frogScreenX();
    const y = frog.y;

    ctx.save();
    ctx.translate(x, y);
    if (frog.state === 'air') {
      ctx.rotate(clamp(frog.vy * 0.035, -0.35, 0.3));
    } else if (frog.state === 'sinking') {
      ctx.rotate(0.22);
    }

    ctx.shadowColor = 'rgba(0,0,0,0.22)';
    ctx.shadowBlur = 5;
    ctx.fillStyle = '#48b14b';
    ctx.beginPath();
    ctx.ellipse(0, 0, FROG_W / 2, FROG_H / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#7fd36f';
    ctx.beginPath();
    ctx.ellipse(0, 4, FROG_W * 0.28, FROG_H * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-7, -6, 5.6, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(7, -6, 5.6, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#10212e';
    ctx.beginPath();
    ctx.arc(-7, -5.5, 2.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(7, -5.5, 2.7, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, 2, 5.5, 0.2, Math.PI - 0.2);
    ctx.stroke();

    if (frog.justBoosted && state.frame % 10 < 5) {
      ctx.strokeStyle = 'rgba(255,255,160,0.95)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawParticles() {
    for (const p of state.particles) {
      const alpha = clamp(p.life / 30, 0, 1);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(worldToScreenX(p.x), p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPads() {
    for (const pad of state.pads) {
      const x = worldToScreenX(pad.x);
      if (x < -pad.w || x > CW + pad.w) continue;
      drawLilyPad(x, pad.y, pad.w, pad.h);
    }
  }

  function drawHud() {
    ctx.fillStyle = 'rgba(8, 18, 32, 0.45)';
    drawRoundedRect(12, 12, 132, 48, 12);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('SCORE', 24, 22);
    ctx.font = 'bold 24px Arial, sans-serif';
    ctx.fillText(String(state.score), 24, 38);

    if (state.mode === 'playing' && state.frog.supportId === 'land') {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      drawRoundedRect(68, 88, 264, 42, 12);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('陸地を走ってジャンプ！', CW / 2, 109);
    }
  }

  function drawTimingPrompt() {
    if (!state.timingWindowActive || state.mode !== 'playing' || state.frog.state !== 'air') return;

    const pulse = Math.sin(state.frame * 0.28) * 0.18 + 0.82;
    const promptX = frogScreenX();
    const promptY = WATER_Y - 28;

    ctx.fillStyle = 'rgba(255, 84, 84, 0.22)';
    ctx.fillRect(0, WATER_Y - TIMING_WINDOW_HEIGHT, CW, TIMING_WINDOW_HEIGHT + 12);

    ctx.strokeStyle = 'rgba(255, 235, 120, 0.95)';
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 6]);
    ctx.beginPath();
    ctx.moveTo(0, WATER_Y);
    ctx.lineTo(CW, WATER_Y);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = 'rgba(255, 255, 130, ' + pulse + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(promptX, WATER_Y - 2, 20 + Math.sin(state.frame * 0.22) * 4, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,140,' + pulse + ')';
    ctx.font = 'bold 22px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('TAP!', promptX, promptY);

    const barW = 110;
    const barH = 8;
    const barX = clamp(promptX - barW / 2, 16, CW - barW - 16);
    const barY = WATER_Y + 16;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    drawRoundedRect(barX, barY, barW, barH, 4);
    ctx.fill();

    ctx.fillStyle = '#ffe66d';
    drawRoundedRect(barX, barY, barW * clamp(state.timingWindowProgress, 0.12, 1), barH, 4);
    ctx.fill();
  }

  function drawOverlay(title, subtitle, buttonLabel) {
    ctx.fillStyle = 'rgba(4, 10, 22, 0.62)';
    ctx.fillRect(0, 0, CW, CH);

    ctx.fillStyle = 'rgba(8, 18, 32, 0.78)';
    drawRoundedRect(42, 94, 316, 248, 22);
    ctx.fill();

    ctx.fillStyle = '#ffd85b';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 40px Arial, sans-serif';
    ctx.fillText(title, CW / 2, 150);

    ctx.fillStyle = '#fff';
    ctx.font = '18px Arial, sans-serif';
    const lines = subtitle.split('\n');
    lines.forEach(function(line, index) {
      ctx.fillText(line, CW / 2, 204 + index * 28);
    });

    const btn = { x: 92, y: 276, w: 216, h: 54 };
    state.buttons.primary = btn;

    const pulse = Math.sin(state.frame * 0.15) * 0.12 + 0.88;
    ctx.fillStyle = 'rgba(94, 197, 88, ' + pulse + ')';
    drawRoundedRect(btn.x, btn.y, btn.w, btn.h, 16);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial, sans-serif';
    ctx.fillText(buttonLabel, CW / 2, btn.y + btn.h / 2);
  }

  function drawTitleScreen() {
    drawBackground();
    drawPads();

    ctx.fillStyle = 'rgba(8,18,32,0.56)';
    drawRoundedRect(36, 74, 328, 238, 22);
    ctx.fill();

    ctx.fillStyle = '#ffd85b';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 42px Arial, sans-serif';
    ctx.fillText('Frog Leaper', CW / 2, 128);

    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial, sans-serif';
    ctx.fillText('カエルの蓮渡り', CW / 2, 166);

    ctx.font = '16px Arial, sans-serif';
    ctx.fillText('陸地から走ってジャンプし、', CW / 2, 208);
    ctx.fillText('水面でタイミング良く TAP! して池を渡ろう', CW / 2, 234);

    drawOverlay('START', 'クリック / タップで開始\nリトライも同じ操作です', 'タップしてスタート');
  }

  function drawGameOver() {
    drawOverlay('GAME OVER', 'Score: ' + state.score + '\nBest: ' + state.bestScore, 'もう一度遊ぶ');
  }

  function draw() {
    clearCanvas();
    drawBackground();
    drawPads();
    drawParticles();
    drawFrog();
    drawTimingPrompt();
    drawHud();

    if (state.mode === 'title') {
      drawTitleScreen();
    } else if (state.mode === 'gameover') {
      drawGameOver();
    } else {
      state.buttons.primary = null;
    }

    finishFrame();
  }

  function getCanvasPoint(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((clientX - rect.left) / rect.width) * CW,
      y: ((clientY - rect.top) / rect.height) * CH
    };
  }

  function isInsideButton(point, button) {
    return !!button && point.x >= button.x && point.x <= button.x + button.w && point.y >= button.y && point.y <= button.y + button.h;
  }

  function tapAtLogicalPoint(point) {
    if (state.mode === 'title') {
      startGame();
      return;
    }

    if (state.mode === 'gameover') {
      if (!state.buttons.primary || isInsideButton(point, state.buttons.primary)) {
        startGame();
      }
      return;
    }

    if (state.mode !== 'playing') return;

    if (state.timingWindowActive && state.frog.state === 'air' && state.frog.alive) {
      launchFrog(true);
      spawnSplash(state.frog.x, WATER_Y, 10);
    }
  }

  function handlePointerDown(clientX, clientY) {
    const point = getCanvasPoint(clientX, clientY);
    tapAtLogicalPoint(point);
  }

  canvas.addEventListener('pointerdown', function(event) {
    event.preventDefault();
    handlePointerDown(event.clientX, event.clientY);
  }, { passive: false });

  canvas.addEventListener('contextmenu', function(event) {
    event.preventDefault();
  });

  window.addEventListener('resize', resize);

  function loop() {
    update();
    draw();
    window.requestAnimationFrame(loop);
  }

  resize();
  resetWorld();
  loop();

  window.__frogDebug = {
    startGame: startGame,
    gameOver: gameOver,
    step: function(frames) {
      const total = Math.max(1, frames || 1);
      for (let i = 0; i < total; i++) update();
    },
    tapLogical: function(x, y) {
      tapAtLogicalPoint({ x: x, y: y });
    },
    getState: function() {
      return JSON.parse(JSON.stringify({
        mode: state.mode,
        score: state.score,
        bestScore: state.bestScore,
        frame: state.frame,
        cameraX: state.cameraX,
        timingWindowActive: state.timingWindowActive,
        buttons: state.buttons,
        frog: state.frog,
        pads: state.pads
      }));
    },
    getConstants: function() {
      return {
        CW: CW,
        CH: CH,
        WATER_Y: WATER_Y,
        SHORE_X: SHORE_X,
        TIMING_WINDOW_HEIGHT: TIMING_WINDOW_HEIGHT,
        SINK_DEPTH: SINK_DEPTH
      };
    }
  };
})();
</script>
</body>
</html>
